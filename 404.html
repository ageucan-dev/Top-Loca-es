      body { min-height: 100vh; margin: 0; display: grid; grid-template-rows: auto 1fr auto; }

      p { max-width: 560px; margin: 0 auto 28px; color: #4b5563; line-height: 1.65; }
      .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
      .button { min-height: 48px; padding: 12px 20px; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: #0b6e3b; border-radius: 999px; font-weight: 750; text-decoration: none; }
      .button--secondary { color: #111827; background: #f5a623; }
      .button:focus-visible { outline: 3px solid #f5a623; outline-offset: 3px; }
